name: Release

# Push a tag equal to manifest.json's version (e.g. 1.0.0) to publish a release with the three files Obsidian
# installs: main.js, manifest.json and styles.css. Each file gets a build provenance attestation.

on:
    push:
        tags:
            - "*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"

            - name: Check the tag matches the manifest version
              run: |
                  version=$(node -p "require('./manifest.json').version")
                  if [ "$version" != "${GITHUB_REF_NAME}" ]; then
                      echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Collect release files
              run: |
                  mkdir release
                  cp build/main.js manifest.json styles.css release/
                  ls -la release

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      release/main.js
                      release/manifest.json
                      release/styles.css

            - name: Extract release notes from CHANGELOG.md
              run: |
                  awk -v version="${GITHUB_REF_NAME}" '
                      $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG.md > release-notes.md
                  if [ ! -s release-notes.md ]; then
                      echo "See CHANGELOG.md" > release-notes.md
                  fi

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prerelease=""
                  case "${GITHUB_REF_NAME}" in 0.*) prerelease="--prerelease" ;; esac
                  gh release create "${GITHUB_REF_NAME}" release/main.js release/manifest.json release/styles.css \
                      --title "${GITHUB_REF_NAME}" --notes-file release-notes.md ${prerelease}
