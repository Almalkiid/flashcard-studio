name: Release

# Pushing a tag that equals the version in manifest.json publishes a GitHub release holding the
# three files Obsidian installs (main.js, manifest.json, styles.css), each with build provenance.
on:
    push:
        tags: ["*"]

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Tag must equal the manifest version
              run: |
                  manifest_version=$(node -p "require('./manifest.json').version")
                  test "$manifest_version" = "$GITHUB_REF_NAME" || {
                    echo "Tag $GITHUB_REF_NAME, but manifest.json says $manifest_version" >&2
                    exit 1
                  }

            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: pnpm build

            - name: Gather the release files
              run: |
                  mkdir dist
                  cp build/main.js manifest.json styles.css dist/

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css

            - name: Take this version's notes from CHANGELOG.md
              run: |
                  awk -v v="$GITHUB_REF_NAME" '
                    $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
                    on && /^## / { exit }
                    on
                  ' CHANGELOG.md > notes.md
                  test -s notes.md || echo "See CHANGELOG.md" > notes.md

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
              # A full release, not a pre-release: BRAT and the community directory ignore pre-releases
              run: |
                  gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css \
                    --title "$GITHUB_REF_NAME" --notes-file notes.md
