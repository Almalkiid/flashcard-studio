packages:
    - "."

# Install scripts that may run (true) or must not run (false)
allowBuilds:
    esbuild: true
    pre-commit: true
    spawn-sync: true
    unrs-resolver: true
    "@parcel/watcher": true
    classic-level: false
    edgedriver: false
    geckodriver: false

minimumReleaseAgeExclude:
    - cross-spawn@6.0.6
    - serialize-javascript@7.0.5
    - js-yaml@3.15.2
    - fast-uri@3.1.8
    - moment@2.31.0
    - brace-expansion@1.1.21
    - brace-expansion@2.1.7
    - brace-expansion@5.0.12
    - basic-ftp@6.2.1
    - shell-quote@1.11.0
    - handlebars@4.7.10

onlyBuiltDependencies:
    - "."

overrides:
    basic-ftp@<=6.2.0: ^6.2.1
    cross-spawn@<6.0.6: ^6.0.6
    moment@>=2.29.2 <2.31.0: ^2.31.0
    serialize-javascript@<=7.0.2: ^7.0.3
    serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
    shell-quote@>=1.8.4 <1.11.0: ^1.11.0

patchedDependencies:
    clozecraft: patches/clozecraft.patch
